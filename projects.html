<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Projects — Rishit Choudhary</title>
        <meta name="description" content="Full archive of projects by Rishit Choudhary." />
        <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/css/main.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    </head>
    <body>
        <div class="bg-grid" aria-hidden="true"></div>

        <header class="navbar">
            <div class="navbar__inner"></div>
        </header>

        <main class="page-content">
            <div class="container">
                <div class="page-header">
                    <h1 class="page-header__title">Projects</h1>
                    <p class="page-header__subtitle">Complete archive of engineering work, experiments, and tools.</p>
                </div>

                <div class="filters" id="project-filters"></div>

                <div class="archive-grid" id="projects-grid"></div>
            </div>
        </main>

        <footer class="footer"></footer>

        <script src="assets/js/data/site.js"></script>
        <script src="assets/js/data/projects.js"></script>
        <script src="assets/js/modal.js"></script>
        <script src="assets/js/filters.js"></script>
        <script src="assets/js/main.js"></script>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const sorted = sortByNewest(PROJECTS, 'year');

                function renderGrid(items) {
                    const grid = document.getElementById('projects-grid');
                    if (!grid) return;
                    grid.innerHTML = '';

                    if (!items.length) {
                        grid.innerHTML = '<p class="empty-state">No projects match this filter.</p>';
                        return;
                    }

                    items.forEach((project) => {
                        const card = createProjectCard(project, openProjectModal);
                        grid.appendChild(card);
                    });
                }

                renderGrid(sorted);
                initFilters('#project-filters', sorted, renderGrid);
            });
        </script>
    </body>
</html>
