<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Certificates — Rishit Choudhary</title>
        <meta name="description" content="Certificate archive for Rishit Choudhary." />
        <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/css/main.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    </head>
    <body class="page-certificates">
        <div class="bg-grid" aria-hidden="true"></div>

        <header class="navbar">
            <div class="navbar__inner"></div>
        </header>

        <main class="page-content">
            <div class="container">
                <div class="page-header">
                    <h1 class="page-header__title">Certificates</h1>
                    <p class="page-header__subtitle">Verified credentials and completed programmes.</p>
                </div>

                <div class="archive-grid archive-grid--certificates" id="certificates-grid"></div>
            </div>
        </main>

        <footer class="footer"></footer>

        <script src="assets/js/data/site.js"></script>
        <script src="assets/js/data/certificates.js"></script>
        <script src="assets/js/modal.js"></script>
        <script src="assets/js/main.js"></script>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const sorted = sortByNewest(CERTIFICATES, 'year');
                const grid = document.getElementById('certificates-grid');
                if (!grid) return;

                if (!sorted.length) {
                    grid.innerHTML = '<p class="empty-state">No certificates yet.</p>';
                    return;
                }

                sorted.forEach((cert) => {
                    const card = createCertificateCard(cert, openCertificateModal);
                    grid.appendChild(card);
                });
            });
        </script>
    </body>
</html>
