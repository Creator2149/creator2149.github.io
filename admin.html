<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin — Portfolio Management</title>
        <meta name="description" content="Admin panel for managing portfolio content." />
        <meta name="robots" content="noindex, nofollow" />
        <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/css/main.css" />
        <link rel="stylesheet" href="assets/css/admin.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <script>
            // SHA-256 hash function
            async function sha256(message) {
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
            }

            // Admin hash from main.js
            const ADMIN_HASH = 'c2102ea6340446722128b1db3b9ac26e59ed820b8898c4a69cbaf90b72012b72';

            // Password protection for direct admin access
            (async () => {
                if (!sessionStorage.getItem('adminAuth')) {
                    const password = prompt('Enter admin password:');
                    if (!password) {
                        window.location.href = 'index.html';
                        return;
                    }
                    const hash = await sha256(password);
                    if (hash !== ADMIN_HASH) {
                        alert('Incorrect password');
                        window.location.href = 'index.html';
                    } else {
                        sessionStorage.setItem('adminAuth', 'true');
                    }
                }
            })();
        </script>
    </head>
    <body>
        <div class="bg-grid" aria-hidden="true"></div>

        <header class="navbar">
            <div class="navbar__inner"></div>
        </header>

        <main class="admin-layout">
            <div class="container">
                <div class="admin-header">
                    <h1 class="admin-header__title">Admin Panel</h1>
                    <p class="admin-header__subtitle">
                        Manage projects, certificates, and Blender work. Changes sync to GitHub on push.
                    </p>
                </div>

                <div id="pat-banner"></div>

                <section class="admin-section">
                    <div class="admin-section__header">
                        <h2 class="admin-section__title">
                            Projects
                            <span class="admin-section__count" id="projects-count"></span>
                        </h2>
                        <button class="btn btn--primary" onclick="Admin.openAddForm('projects')">Add Project</button>
                    </div>
                    <div id="projects-list"></div>
                </section>

                <section class="admin-section">
                    <div class="admin-section__header">
                        <h2 class="admin-section__title">
                            Certificates
                            <span class="admin-section__count" id="certificates-count"></span>
                        </h2>
                        <button class="btn btn--primary" onclick="Admin.openAddForm('certificates')">
                            Add Certificate
                        </button>
                    </div>
                    <div id="certificates-list"></div>
                </section>

                <section class="admin-section">
                    <div class="admin-section__header">
                        <h2 class="admin-section__title">
                            Blender
                            <span class="admin-section__count" id="blender-count"></span>
                        </h2>
                        <button class="btn btn--primary" onclick="Admin.openAddForm('blender')">
                            Add Blender Project
                        </button>
                    </div>
                    <div id="blender-list"></div>
                </section>

                <div id="form-container"></div>

                <div id="sync-bar"></div>
            </div>
        </main>

        <script src="assets/js/data/site.js"></script>
        <script src="assets/js/data/projects.js"></script>
        <script src="assets/js/data/certificates.js"></script>
        <script src="assets/js/data/blender.js"></script>
        <script src="assets/js/github.js"></script>
        <script src="assets/js/main.js"></script>
        <script src="assets/js/admin.js"></script>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                function updateCounts() {
                    const pc = document.getElementById('projects-count');
                    const cc = document.getElementById('certificates-count');
                    const bc = document.getElementById('blender-count');
                    if (pc) pc.textContent = `(${PROJECTS.length})`;
                    if (cc) cc.textContent = `(${CERTIFICATES.length})`;
                    if (bc) bc.textContent = `(${BLENDER_PROJECTS.length})`;
                }
                updateCounts();

                const observer = new MutationObserver(updateCounts);
                const lists = document.querySelectorAll('#projects-list, #certificates-list, #blender-list');
                lists.forEach((el) => observer.observe(el, { childList: true, subtree: true }));
            });
        </script>
    </body>
</html>
