<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blender — Rishit Choudhary</title>
        <meta name="description" content="Blender 3D render gallery by Rishit Choudhary." />
        <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/assets/css/main.css" />
    </head>
    <body>
        <!-- Navbar -->
        <header class="navbar">
            <div class="navbar__inner"></div>
        </header>

        <!-- Main Content -->
        <main class="page-content">
            <div class="container">
                <!-- Page Header -->
                <div class="page-header">
                    <h1 class="page-header__title">Blender</h1>
                    <p class="page-header__subtitle">3D renders, studies, and visual experiments.</p>
                </div>

                <!-- Blender Gallery Grid -->
                <div class="archive-grid archive-grid--blender" id="blender-grid"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer"></footer>

        <!-- Scripts -->
        <script src="/assets/js/data/site.js"></script>
        <script src="/assets/js/data/blender.js"></script>
        <script src="/assets/js/modal.js"></script>
        <script src="/assets/js/main.js"></script>

        <!-- Page logic -->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const sorted = sortByNewest(BLENDER_PROJECTS, 'date');
                const grid = document.getElementById('blender-grid');
                if (!grid) return;

                if (!sorted.length) {
                    grid.innerHTML = '<p class="empty-state">No Blender projects yet.</p>';
                    return;
                }

                sorted.forEach((item) => {
                    const card = createBlenderCard(item, openBlenderModal);
                    grid.appendChild(card);
                });
            });
        </script>
    </body>
</html>
